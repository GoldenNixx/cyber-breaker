buildscript {
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  }
  dependencies {


  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // Permite usar la opción "Build and run using IntelliJ IDEA" de la configuración de IDEA.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  sourceCompatibility = JavaVersion.VERSION_1_8
  targetCompatibility = JavaVersion.VERSION_1_8

  // Basado en https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // Genera la lista de recursos (assets.txt) del proyecto.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // carpetaProyecto/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // carpetaProyecto/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // borra el archivo por si ya se había creado
    assetsFile.delete()

    // recorre todos los archivos de esa carpeta,
    // los convierte a ruta relativa
    // y los agrega a assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = '$projectVersion'
  ext.appName = 'BlockBreaker2024'
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    // Si hay errores al descargar dependencias, conviene quitar la línea siguiente.
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }
}

eclipse.project.name = 'BlockBreaker2024' + '-parent'
